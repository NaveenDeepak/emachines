# ============================================================
# emachines — Documentation Build & Deploy
# ============================================================
#
# Builds the Quarto documentation site from the nbs/ notebooks
# using nbdev_docs and deploys it to GitHub Pages.
#
# Trigger: push to main (after CI passes) or manual dispatch.
# URL:     https://NaveenDeepak.github.io/emachines
# ============================================================

name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install nbdev and project
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "nbdev==3.3.2" "jupyterlab>=4.0.0"

      - name: Build docs with nbdev
        run: nbdev-docs

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-docs
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
