<text x="40.0" y="564.0" text-anchor="start" font-size="13" fill="#222" >Open slot: <tspan font-style="italic">b</tspan><tspan font-size="10" dy="4">0</tspan><tspan dy="-4"> </tspan> = <tspan font-style="italic">b</tspan><tspan font-size="10" dy="4">s</tspan><tspan dy="-4"> </tspan>,  <tspan font-style="italic">h</tspan><tspan font-size="10" dy="4">0</tspan><tspan dy="-4"> </tspan> = <tspan font-style="italic">h</tspan><tspan font-size="10" dy="4">1</tspan><tspan dy="-4"> </tspan> = 0.   An optional separator <tspan font-style="italic">h</tspan><tspan font-size="10" dy="4">sep</tspan><tspan dy="-4"> </tspan> sits between layers.</text>
