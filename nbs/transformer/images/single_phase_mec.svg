<text x="570" y="110" font-weight="bold" font-size="13">Elements</text>
<text x="570" y="129" font-size="12.5" fill="#333" xml:space="preserve">resistor = reluctance  ℛ = l / (μA)</text>
<text x="570" y="148" font-size="12.5" fill="#333" xml:space="preserve">circle with arrow = MMF source N·i</text>
<text x="570" y="167" font-size="12.5" fill="#333" xml:space="preserve">(arrow: direction of the MMF; under load</text>
<text x="570" y="186" font-size="12.5" fill="#333" xml:space="preserve"> N₂i₂ opposes N₁i₁)</text>
<text x="570" y="215" font-weight="bold" font-size="13">Branches between nodes</text>
<text x="570" y="234" font-size="12.5" fill="#333" xml:space="preserve">C–B: limb inside both windings,</text>
<text x="570" y="253" font-size="12.5" fill="#333" xml:space="preserve">     ℛ_limb,1 in series with N₁i₁</text>
<text x="570" y="272" font-size="12.5" fill="#333" xml:space="preserve">C–B: duct between the windings, ℛ_σ</text>
<text x="570" y="291" font-size="12.5" fill="#333" xml:space="preserve">     (in parallel with the limb branch)</text>
<text x="570" y="310" font-size="12.5" fill="#333" xml:space="preserve">A–C: N₂i₂, common to limb and duct</text>
<text x="570" y="329" font-size="12.5" fill="#333" xml:space="preserve">A–B: return path in series:</text>
<text x="570" y="348" font-size="12.5" fill="#333" xml:space="preserve">     ℛ_yoke + ℛ_limb,2 + ℛ_yoke + ℛ_g</text>
<text x="570" y="377" font-weight="bold" font-size="13">Loops (each encloses its windings)</text>
<text x="570" y="396" font-size="12.5" fill="#333" xml:space="preserve">limb + duct: primary only</text>
<text x="570" y="415" font-size="12.5" fill="#333" xml:space="preserve">duct + return: secondary only</text>
<text x="570" y="434" font-size="12.5" fill="#333" xml:space="preserve">limb + return: both windings</text>
<text x="570" y="463" font-weight="bold" font-size="13">Fluxes</text>
<text x="570" y="482" font-size="12.5" fill="#333" xml:space="preserve">Φ₁ = Φ_m − Φ_σ  (limb flux)</text>
<text x="570" y="501" font-size="12.5" fill="#333" xml:space="preserve">Φ_m mutual (return) flux, Φ_σ leakage</text>
<text x="30" y="576" font-size="11" fill="#555">Not to scale. ℛ_g lumps every joint gap along the path (joint_gap_total); joints are drawn on the bottom yoke only for illustration.</text>
</svg>